substitutions:
  _REGION: europe-west3
  _SERVICE: matchpulse-stage
  _REPOSITORY: matchpulse
  _IMAGE: matchpulse-web
  _ENV_FILE: deploy/staging.env.yaml

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    entrypoint: bash
    args:
      - -ceu
      - |
        ENV_FILE="${_ENV_FILE}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}"

        if [ ! -f "$${ENV_FILE}" ]; then
          echo "Missing $${ENV_FILE}. Copy deploy/staging.env.yaml.example and fill staging values before running Cloud Build." >&2
          exit 1
        fi

        get_env() {
          key="$1"
          value="$(grep -E "^$${key}:" "$${ENV_FILE}" | head -n 1 | sed -E "s/^$${key}:[[:space:]]*//; s/^\"//; s/\"$//")"
          if [ -z "$${value}" ]; then
            echo "Missing $${key} in $${ENV_FILE}" >&2
            exit 1
          fi
          printf '%s' "$${value}"
        }

        docker build \
          --build-arg APP_ENV="$(get_env APP_ENV)" \
          --build-arg NEXT_PUBLIC_APP_URL="$(get_env NEXT_PUBLIC_APP_URL)" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$(get_env NEXT_PUBLIC_FIREBASE_API_KEY)" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(get_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(get_env NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$(get_env NEXT_PUBLIC_FIREBASE_APP_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(get_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(get_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
          --build-arg GOOGLE_CLOUD_PROJECT="$(get_env GOOGLE_CLOUD_PROJECT)" \
          --build-arg FIREBASE_PROJECT_ID="$(get_env FIREBASE_PROJECT_ID)" \
          --build-arg SPORTS_PROVIDER="$(get_env SPORTS_PROVIDER)" \
          --build-arg SIM_DEFAULT_RUNS="$(get_env SIM_DEFAULT_RUNS)" \
          --build-arg PUBLIC_SIM_RUNS="$(get_env PUBLIC_SIM_RUNS)" \
          --build-arg LIVE_CACHE_TTL_SEC="$(get_env LIVE_CACHE_TTL_SEC)" \
          --build-arg INSIGHT_CACHE_TTL_SEC="$(get_env INSIGHT_CACHE_TTL_SEC)" \
          --build-arg PUBLIC_SIM_CACHE_TTL_SEC="$(get_env PUBLIC_SIM_CACHE_TTL_SEC)" \
          --build-arg AD_PROVIDER="$(get_env AD_PROVIDER)" \
          --build-arg CONSENT_MODE="$(get_env CONSENT_MODE)" \
          -t "$${IMAGE_URI}" \
          .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --env-vars-file=${_ENV_FILE}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
